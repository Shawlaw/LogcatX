name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The gate lives in scripts/ci_gate.sh so local pre-push checks and
      # CI run the identical steps — edit the script, never a copy of it.
      - name: Gate (fmt / clippy / test)
        shell: bash
        run: ./scripts/ci_gate.sh
