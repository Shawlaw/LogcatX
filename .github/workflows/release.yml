name: release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run tests before building
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    env:
      LOGCATX_UPDATE_PUBLIC_KEY: ${{ vars.LOGCATX_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to detect version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "Tag v$TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Test
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        run: cargo test

      - name: Compute release metadata
        id: release_meta
        shell: pwsh
        run: |
          $versionName = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $versionName) { throw "Failed to detect version from Cargo.toml" }
          $commitId = "${{ github.sha }}".Substring(0, 7)
          "version=$versionName" >> $env:GITHUB_OUTPUT
          "artifact_name=logcatx-release($($versionName)_$commitId)" >> $env:GITHUB_OUTPUT
          "zip_name=LogcatX_$($versionName)_windows_x64_portable_$commitId.zip" >> $env:GITHUB_OUTPUT

      - name: Build portable zip
        shell: bash
        run: ./scripts/package_windows_release.sh

      - name: Verify expected artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ ! -f "dist/${{ steps.release_meta.outputs.zip_name }}" ]]; then
            echo "Expected ${{ steps.release_meta.outputs.zip_name }} was not produced:" >&2
            ls dist >&2
            exit 1
          fi
          cp "dist/${{ steps.release_meta.outputs.zip_name }}" artifacts/

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versionName = "${{ steps.release_meta.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($versionName))\].*?(?=^## \[|\z)"
          $notes = [regex]::Match($changelog, $pattern)
          if (-not $notes.Success) { throw "CHANGELOG.md does not contain release notes for $versionName" }
          Set-Content -Path artifacts/release-notes.md -Value $notes.Value.Trim()

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release_meta.outputs.artifact_name }}
          path: dist/${{ steps.release_meta.outputs.zip_name }}

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.release_meta.outputs.zip_name }}
          body_path: artifacts/release-notes.md

      - name: Publish signed application update manifest
        if: startsWith(github.ref, 'refs/tags/v') && vars.LOGCATX_UPDATE_PUBLIC_KEY != ''
        uses: Shawlaw/DeskFoundry/actions/publish-portable-update@v0.1.4
        with:
          app-id: com.logcatx.app
          version: ${{ steps.release_meta.outputs.version }}
          asset-path: artifacts/${{ steps.release_meta.outputs.zip_name }}
          asset-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.release_meta.outputs.zip_name }}
          notes-url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          private-key: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          public-key: ${{ vars.LOGCATX_UPDATE_PUBLIC_KEY }}
          branch: master
