name: release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run tests before building
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    env:
      LOGCATX_UPDATE_PUBLIC_KEY: ${{ vars.LOGCATX_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Probe resource compiler resolution
        shell: bash
        run: |
          WHERE_OUT=$(where.exe llvm-rc 2>/dev/null | tr '\n' ';' || true)
          WHICH_OUT=$(which -a llvm-rc 2>/dev/null | tr '\n' ';' || true)
          echo "::notice title=rc-probe::where=[$WHERE_OUT] which=[$WHICH_OUT]"

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to detect version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "Tag v$TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Test
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
        shell: pwsh
        run: |
          cargo test 2>&1 | Tee-Object -FilePath test-output.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content test-output.log | Select-Object -Last 25) -join " ⏎ "
            if ($tail.Length -gt 1800) { $tail = $tail.Substring($tail.Length - 1800) }
            Write-Host "::error title=cargo test failed::$tail"
            exit 1
          }

      - name: Compute release metadata
        id: release_meta
        shell: pwsh
        run: |
          $versionName = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $versionName) { throw "Failed to detect version from Cargo.toml" }
          $commitId = "${{ github.sha }}".Substring(0, 7)
          "version=$versionName" >> $env:GITHUB_OUTPUT
          "artifact_name=logcatx-release($($versionName)_$commitId)" >> $env:GITHUB_OUTPUT
          "zip_name=LogcatX_$($versionName)_windows_x64_portable_$commitId.zip" >> $env:GITHUB_OUTPUT

      - name: Build portable zip
        shell: bash
        run: ./scripts/package_windows_release.sh

      - name: Verify exe resources
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = "dist/LogcatX.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error title=exe resources missing::dist/LogcatX.exe was not produced"
            exit 1
          }
          $vi = (Get-Item $exe).VersionInfo
          if ([string]::IsNullOrWhiteSpace($vi.ProductVersion)) {
            Write-Host "::error title=exe resources missing::LogcatX.exe carries no embedded VERSIONINFO/icon; the resource compiler lookup failed silently"
            exit 1
          }
          # PRD §37/§49: numeric FILEVERSION must mirror the SemVer, never a
          # build date or commit.
          $expected = "${{ steps.release_meta.outputs.version }}.0"
          if ($vi.FileVersion -ne $expected) {
            Write-Host "::error title=version mismatch::FileVersion $($vi.FileVersion) != $expected"
            exit 1
          }
          Write-Host "::notice title=exe resources::LogcatX.exe ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion)"

      # PRD §48: smoke-test the shipped artifact — unzip, verify the helper
      # beside the exe, and read the version through the CLI surface.
      - name: Release artifact smoke test
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $smoke = Join-Path $env:RUNNER_TEMP "logcatx-smoke"
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          Expand-Archive -Path "dist/${{ steps.release_meta.outputs.zip_name }}" -DestinationPath $smoke
          if (-not (Test-Path (Join-Path $smoke "LogcatX.exe"))) {
            Write-Host "::error title=smoke::LogcatX.exe missing from the shipped zip"
            exit 1
          }
          if (-not (Test-Path (Join-Path $smoke "LogcatX.Updater.exe"))) {
            Write-Host "::error title=smoke::LogcatX.Updater.exe missing from the shipped zip"
            exit 1
          }
          $output = & (Join-Path $smoke "LogcatX.exe") --version | Out-String
          Write-Host "smoke --version: $output"
          if (-not ($output -match [regex]::Escape($version))) {
            Write-Host "::error title=smoke::--version output did not contain $version"
            exit 1
          }

      - name: Verify expected artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ ! -f "dist/${{ steps.release_meta.outputs.zip_name }}" ]]; then
            echo "Expected ${{ steps.release_meta.outputs.zip_name }} was not produced:" >&2
            ls dist >&2
            exit 1
          fi
          cp "dist/${{ steps.release_meta.outputs.zip_name }}" artifacts/

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versionName = "${{ steps.release_meta.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($versionName))\].*?(?=^## \[|\z)"
          $notes = [regex]::Match($changelog, $pattern)
          if (-not $notes.Success) { throw "CHANGELOG.md does not contain release notes for $versionName" }
          Set-Content -Path artifacts/release-notes.md -Value $notes.Value.Trim()

      # The updater's notesUrl points at this raw Markdown file (PRD §28);
      # the manifest schema itself is unchanged so 0.8 clients keep working
      # (PRD §29). One source feeds the GitHub Release body and the in-app
      # release-notes view.
      - name: Publish release notes file
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_meta.outputs.version }}"
          mkdir -p updates/notes
          cp artifacts/release-notes.md "updates/notes/${version}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/notes
          if git diff --cached --quiet; then
            echo "No release notes changes to commit"
          else
            git commit -m "chore(update): publish release notes for ${version}"
            # Tag checkouts are detached HEADs; a bare push fails with
            # "You are not currently on a branch".
            git push origin HEAD:master
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release_meta.outputs.artifact_name }}
          path: dist/${{ steps.release_meta.outputs.zip_name }}

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.release_meta.outputs.zip_name }}
          body_path: artifacts/release-notes.md

      - name: Publish signed application update manifest
        if: startsWith(github.ref, 'refs/tags/v') && vars.LOGCATX_UPDATE_PUBLIC_KEY != ''
        uses: Shawlaw/DeskFoundry/actions/publish-portable-update@v0.1.6
        with:
          app-id: com.logcatx.app
          version: ${{ steps.release_meta.outputs.version }}
          asset-path: artifacts/${{ steps.release_meta.outputs.zip_name }}
          asset-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.release_meta.outputs.zip_name }}
          notes-url: https://raw.githubusercontent.com/${{ github.repository }}/master/updates/notes/${{ steps.release_meta.outputs.version }}.md
          private-key: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          public-key: ${{ vars.LOGCATX_UPDATE_PUBLIC_KEY }}
          branch: master
