name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to detect version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "Tag v$TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Build release artifacts
        shell: bash
        run: ./scripts/package_windows_release.sh

      - name: Read annotated tag notes
        id: tag_notes
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF}"
          if [[ "$TAG_REF" != refs/tags/* ]]; then
            echo "Expected a tag ref in GITHUB_REF, got '${TAG_REF}'." >&2
            exit 1
          fi
          TAG_NAME="${TAG_REF#refs/tags/}"

          echo "Refreshing tag ref '${TAG_REF}' from origin before validation..."
          git fetch --force --no-tags origin "+${TAG_REF}:${TAG_REF}"

          TAG_OBJECT_TYPE="$(git cat-file -t "$TAG_REF" 2>/dev/null || true)"
          TAG_OBJECT_ID="$(git rev-parse -q --verify "${TAG_REF}^{tag}" 2>/dev/null || true)"
          TAG_COMMIT_ID="$(git rev-parse -q --verify "${TAG_REF}^{commit}" 2>/dev/null || true)"
          if [[ -z "$TAG_OBJECT_ID" ]]; then
            echo "GitHub Release notes must come from an annotated tag, but '${TAG_NAME}' is not annotated." >&2
            echo "Debug: ref=${TAG_REF}, object_type=${TAG_OBJECT_TYPE:-<missing>}, commit=${TAG_COMMIT_ID:-<missing>}" >&2
            echo "Hint: create and push an annotated tag: git tag -a ${TAG_NAME} -m \"Release ${TAG_NAME}\" && git push origin ${TAG_NAME}" >&2
            exit 1
          fi

          echo "Validated annotated tag '${TAG_NAME}': tag_object=${TAG_OBJECT_ID}, commit=${TAG_COMMIT_ID}"
          {
            echo "body<<EOF"
            git for-each-ref "$TAG_REF" --format='%(contents)'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LogcatX.exe
            dist/LogcatX-${{ github.ref_name }}-win64.zip
          body: ${{ steps.tag_notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
