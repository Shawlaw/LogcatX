[package]
name = "logcatx"
version = "0.5.3"
edition = "2024"
description = "LogcatX - Windows-first desktop GUI tool for collecting adb logcat from multiple devices"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
desktop-config = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.0", package = "desktop-config" }
desktop-fs = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.0", package = "desktop-fs" }
desktop-i18n = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.0", package = "desktop-i18n" }
desktop-logger = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.0", package = "desktop-logger" }
directories = "5"
eframe = "0.31"
log = { version = "0.4", features = ["std"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
console = []

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
