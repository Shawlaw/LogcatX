[package]
name = "logcatx"
version = "0.6.0"
edition = "2024"
description = "LogcatX - Windows-first desktop GUI tool for collecting adb logcat from multiple devices"
default-run = "logcatx"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
desktop-config = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.4", package = "desktop-config" }
desktop-fs = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.4", package = "desktop-fs" }
desktop-i18n = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.4", package = "desktop-i18n" }
desktop-logger = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.4", package = "desktop-logger" }
desktop-updater = { git = "https://github.com/Shawlaw/DeskFoundry", tag = "v0.1.4", package = "desktop-updater" }
directories = "5"
eframe = "0.31"
log = { version = "0.4", features = ["std"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = []
console = []
update-preview = []

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
