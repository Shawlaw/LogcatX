[package]
name = "logcatx"
version = "0.2.0"
edition = "2024"
description = "LogcatX - Windows-first desktop GUI tool for collecting adb logcat from multiple devices"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5"
eframe = "0.31"
log = { version = "0.4", features = ["std"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[features]
default = []
console = []

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
